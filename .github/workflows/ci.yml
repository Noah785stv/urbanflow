name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: urbanflow
          POSTGRES_PASSWORD: urbanflow
          POSTGRES_DB: urbanflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://urbanflow:urbanflow@localhost:5432/urbanflow_test
          REDIS_URL: redis://localhost:6379

      - name: Run database migrations
        run: pnpm --filter @urbanflow/api migration:run
        env:
          DATABASE_URL: postgresql://urbanflow:urbanflow@localhost:5432/urbanflow_test
          NODE_ENV: test

      - name: Test e2e
        run: pnpm test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://urbanflow:urbanflow@localhost:5432/urbanflow_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-only-jwt-secret-not-a-real-value
          JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-value
          ENCRYPTION_KEY: 4DUTb14VQ7ZTw3A4Kvux6xkkyGuNzXq1nO60U8p2dWc=
          GBFS_FEED_URLS: '[]'
          OTP_BASE_URL: http://127.0.0.1:8081

      - name: Build
        run: pnpm build

  quality-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Unit tests (Vitest)
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E + accessibility tests (Playwright, axe-core)
        run: pnpm --filter web test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
